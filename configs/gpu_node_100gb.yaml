# Machine B — Remote GPU Compute Node Configuration (100 GB Expansion)
# Role: Self-Supervised Pretraining, Multi-Task Model Training, High-Throughput Fine-Tuning
# Configured for NOAA TC PRIMED v01r01-final 100 GB expansion dataset

machine:
  role: "gpu_node"
  hostname: "gpu-node-bravo-100gb"
  os: "Linux / Windows 11 with NVIDIA Drivers"
  device: "cuda"
  cuda_device_id: 0
  num_workers: 0
  precision: "fp16" # "fp16" or "bf16" (amp enabled)

paths:
  staged_data_dir: "data/processed/tcprimed_100gb" # Unpacked staged containers for 100 GB
  staging_manifest: "staging/staging_manifest_100gb.json"
  sample_index_path: "reports/pipeline_100gb/sample_index.csv"
  split_manifest_path: "reports/pipeline_100gb/storm_split_manifest.csv"
  checkpoints_dir: "checkpoints/tcprimed_100gb"
  logs_dir: "logs/training_100gb"
  reports_dir: "reports/phase2e4_100gb"
  training_summary_path: "reports/phase2e4_100gb/multitask_training_summary.json"
  evaluation_output_dir: "reports/evaluation_100gb"

capabilities:
  can_train_heavy_models: true
  can_run_smoke_tests: true
  can_preprocess_raw_data: false # Preprocessing executed on Machine A
  can_package_shards: false
  distributed: false # single node, single or multi-GPU

training:
  batch_size: 32
  accumulate_grad_batches: 2
  max_epochs: 12
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  gradient_clip_val: 1.0
  mixed_precision: true
  pin_memory: true
  persistent_workers: false
  output_report: "reports/phase2e4_100gb/multitask_training_summary.json"

loss_weights:
  weight_intensity: 1.0
  weight_pressure: 0.5
  weight_stage: 0.5
  weight_intensity_change: 1.0
  weight_ri: 2.0
  weight_track: 1.0
  ri_pos_weight: 18.10 # Strictly fitted on 100 GB TRAIN partition (9016 neg / 498 pos)
