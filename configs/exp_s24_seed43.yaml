# Experiment S24 — Longer Schedule Supervised TC-GraphFormer (Seed 43)
# Exact recipe from S24 (config hash c451dd564f7d) with seed=43
experiment:
  name: "exp_s24_seed43"
  description: "24-epoch cosine schedule from pretrained_backbone.pt (seed 43, V1 loss, LR 3e-4, wd 1e-4, 165 opt steps/epoch, early stop patience 5 on VAL loss)"

machine:
  role: "gpu_node"
  device: "cuda"
  cuda_device_id: 0
  num_workers: 0
  precision: "fp16"

paths:
  staged_data_dir: "data/processed/tcprimed_100gb"
  sample_index_path: "reports/pipeline_100gb/sample_index.csv"
  split_manifest_path: "reports/pipeline_100gb/storm_split_manifest.csv"
  checkpoints_dir: "checkpoints/tcprimed_100gb_exp_s24_seed43"
  reports_dir: "reports/phase2e4_100gb"
  training_summary_path: "reports/phase2e4_100gb/exp_s24_seed43_summary.json"
  epoch_csv_path: "reports/phase2e4_100gb/exp_s24_seed43_epochs.csv"

training:
  seed: 43
  epochs: 24
  cosine_t_max: 24
  eta_min: 1.0e-6
  batch_size: 32
  accumulate_grad_batches: 2
  learning_rate: 3.0e-4
  backbone_lr_scale: 1.0
  weight_decay: 1.0e-4
  decoupled_weight_decay: false
  d_model: 128
  head_dropout: 0.0
  grad_clip_norm: 1.0
  mixed_precision: true
  precision: "fp16"
  pin_memory: true
  persistent_workers: false
  use_sequences: true
  max_history_len: 4
  max_history_hours: 72.0
  pretrained_checkpoint: "checkpoints/tcprimed_100gb/pretrained_backbone.pt"
  checkpoint_dir: "checkpoints/tcprimed_100gb_exp_s24_seed43"
  output_report: "reports/phase2e4_100gb/exp_s24_seed43_summary.json"
  epoch_csv_report: "reports/phase2e4_100gb/exp_s24_seed43_epochs.csv"

  # R1 regularizers strictly OFF for S24
  use_ema: false
  modality_dropout_prob: 0.0
  sector_token_dropout: 0.0
  drop_path_rate: 0.0
  use_storm_balanced_sampler: false

  # Early stopping on global VAL loss with patience 5
  selection_metric: "val_loss"
  early_stop_patience: 5
  train_eval_subset_size: 0
  full_train_eval_on_best: false

loss_weights:
  weight_intensity: 1.0
  weight_pressure: 0.5
  weight_stage: 0.5
  weight_intensity_change: 1.0
  weight_ri: 2.0
  weight_track: 1.0
  ri_pos_weight: 18.10
  regime_max_extra_weight: 2.5
  regime_power: 2.0
  ri_prior_shift_factor: 0.85

