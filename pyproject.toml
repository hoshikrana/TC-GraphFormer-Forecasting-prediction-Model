[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tc-graphformer"
version = "1.0.0"
description = "Multimodal Spatiotemporal Graph-Transformer for Tropical Cyclone Forecasting on NOAA TC PRIMED"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Hoshik Rana", email = "hoshikrana12@gmail.com" }
]
keywords = [
    "tropical-cyclones",
    "deep-learning",
    "graph-neural-networks",
    "transformers",
    "satellite-remote-sensing",
    "meteorology",
    "noaa-tc-primed",
    "spatiotemporal"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "netCDF4>=1.6.0",
    "cftime>=1.6.0",
    "PyYAML>=6.0",
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
    "networkx>=3.0",
    "tqdm>=4.65.0",
    "typing_extensions>=4.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.0.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0"
]

[project.scripts]
tcprimed-pipeline = "tcprimed_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tcprimed_pipeline*", "src*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

